services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portside
      POSTGRES_PASSWORD: portside
      POSTGRES_DB: portside
    ports:
      - "5432:5432"
    volumes:
      - portside_pgdata:/var/lib/postgresql/data

volumes:
  portside_pgdata:
